[[profile.default.overrides]]
filter = 'binary(/^e2e_/)'
retries = 0
# Bound the complete test, including cleanup.
slow-timeout = { period = "60s", terminate-after = 2 }

# CI profile (Buildkite sets NEXTEST_PROFILE=ci). Inherits the default
# profile's settings and overrides; adds a JUnit report, which
# .buildkite/scripts/nextest-bktec.py reports to Buildkite Test Engine.
[profile.ci.junit]
# Relative to target/nextest/ci/, so test-results/ in the workspace root.
path = "../../../test-results/junit.xml"
